version: "3.9"

# ════════════════════════════════════════════════════════════════════════════════
# Production docker-compose
# Usage:
#   docker compose up -d --build
# Required secrets (set in .env or your secrets manager before starting):
#   MONGO_PASS, MONGO_URI, AZURE_CONNECTION_STRING (or other storage creds)
# ════════════════════════════════════════════════════════════════════════════════

services:
  # ── App ──────────────────────────────────────────────────────────────────────
  file-upload-service:
    build:
      context: .
      dockerfile: Dockerfile
      # Never use dev/cached layers in production
      args:
        - NODE_ENV=production
    image: file-upload-service:${APP_VERSION:-latest}
    container_name: file-upload-service
    restart: always # always restart on failure (not unless-stopped)
    # No direct host port - Traefik (joined via the `edge` network, see
    # labels below) is now the reverse proxy this comment used to anticipate
    # adding later. Reachable from the host only through Traefik's TLS entrypoint.
    env_file: .env # base config (secrets, storage creds, etc.)
    environment:
      NODE_ENV: production
      # ── Scaling ──────────────────────────────────────────────────────────────
      CLUSTER_WORKERS: ${CLUSTER_WORKERS:-0} # 0 = one worker per CPU core
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-30000}
      GENERAL_RATE_LIMIT: ${GENERAL_RATE_LIMIT:-300}
      GENERAL_RATE_WINDOW: ${GENERAL_RATE_WINDOW:-60000}
      ENABLE_COMPRESSION: ${ENABLE_COMPRESSION:-true}
      # Redis — shared rate-limit counters across all cluster workers / replicas (optional)
      REDIS_URL: ${REDIS_URL:-}
    volumes:
      # Named volume for local storage fallback — irrelevant when using S3/Azure/GCS/R2
      - uploads_data:/app/uploads
      # Mount read-only so the container cannot write outside its own uploads dir
      # - ./logs:/app/logs   # uncomment once structured logging is added
    networks:
      - internal
      - edge
    labels:
      # The reverse-proxy this file's own comment anticipated - Traefik (the
      # separate infra/ repo's stack), reached via the external `edge`
      # network. Requires that stack running and TRAEFIK_NETWORK_NAME=edge.
      - traefik.enable=true
      - traefik.docker.network=edge
      - traefik.http.routers.file-upload-service.entrypoints=websecure
      - "traefik.http.routers.file-upload-service.rule=Host(`files.easydev.in`)"
      - traefik.http.routers.file-upload-service.tls=true
      - traefik.http.routers.file-upload-service.tls.certresolver=le
      - traefik.http.routers.file-upload-service.middlewares=security-headers@file
      - traefik.http.services.file-upload-service.loadbalancer.server.port=4001
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 1 # set > 1 for Swarm; use REDIS_URL with replicas > 1
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 60s
    # Harden the container at runtime
    read_only: false # keep false — multer writes temp buffers
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN # needed for uploads dir ownership on first start
      - SETUID
      - SETGID

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  uploads_data:
    driver: local

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  internal:
    driver: bridge
    # Isolate: only containers on this network can reach each other.
    # For Swarm overlay, change driver to: overlay
    # internal: true                        # no outbound internet from this network segment
  # Created by the separate infra/ repo's Traefik+Portainer stack.
  edge:
    external: true
