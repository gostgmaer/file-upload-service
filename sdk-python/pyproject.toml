[project]
name = "easydev-file-upload-sdk"
version = "0.1.0"
description = "Sync + async Python SDK for the multi-tenant File Upload Service"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "EasyDev Team" }]
keywords = ["file-upload", "sdk", "microservice", "multi-tenant", "easydev"]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.urls]
Repository = "https://github.com/gostgmaer/file-upload-service"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/file_upload_sdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
